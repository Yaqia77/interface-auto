# 全局配置
default_env: test

# 凭证变量文件（账号密码等敏感信息，已加入 .gitignore 不入库）
# 从 data/secret_vars_template.xlsx 复制为该文件名并填入真实值，程序运行时自动加载
secret_vars_file: data/secret_vars.xlsx

# 公共脚本库（前后置处理器，设计文档 2.4）：用例 Excel 的「前置脚本 / 后置脚本」列按名引用这里的脚本
scripts_file: data/scripts.json

# 环境配置：base_url 用于拼接用例中的相对路径；default_headers 与用例请求头合并（用例优先）
env:
  test:
    base_url: https://test.yun.139.com/ai/album-saas-test
    timeout: 15
    verify_ssl: false
    default_headers:
      User-Agent: interface-auto/1.0
  algo:
    base_url: https://test.yun.139.com/ai/ai-test
    timeout: 30
    verify_ssl: false
    default_headers:
      User-Agent: interface-auto/1.0
  env_3:
    base_url: https://test.yun.139.com
    timeout: 15
    verify_ssl: false
    default_headers: {}

# 报告开关
report:
  html: true        # 每次运行生成 reports/<时间戳>/report.html（单文件，双击可看）
  allure: true      # 每次运行生成 reports/<时间戳>/allure-results/

# UI 自动化执行参数（三期-B）：批次级默认值，用例显式设了 retry(>0) 时以用例为准
ui:
  retry_default: 0  # 失败重试次数默认值（0–3，0=不重试；采集模式永不重试）

# 日志
log:
  level: INFO       # DEBUG / INFO / WARNING / ERROR
